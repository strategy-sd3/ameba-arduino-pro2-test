name: SDK Release Dispatch

on:
  workflow_dispatch:

env:
  REPO_NAME: "ameba_pro2"
  JSON_LINK_DEV: "https://github.com/strategy-sd3/ameba-arduino-pro2-test/blob/dev/Arduino_package/package_realtek_amebapro2_early_index.json"
  RELEASE_BRANCH_NAME: "main"
  RELEASE_COMMIT_LOG: "./.github/release_commit_log.txt"
  RELEASE_LOG: "./.github/release_log.txt"

jobs:
  SDK_Release_Workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out code with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout private scripts
        uses: actions/checkout@v4
        with:
          repository: strategy-sd3/py_script_for_release
          token: ${{ secrets.GH_PAT }}
          path: private_scripts
          sparse-checkout: |
            ameba_arduino_release_notes_maker.py
            ameba_arduino_release_package_maker.py

      - name: Check branch
        run: |
          echo "Current branch (full ref): $GITHUB_REF"
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "Continue with $GITHUB_REF"
          else
            echo "Error: This workflow must run on the dev branch."
            exit 1
          fi
        shell: bash

      - name: Latest tag
        run: |
          echo "LAST_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

      - name: Zip packages
        run: |
          bash .github/Scripts/Bash/tar_package.sh
          echo "PACKAGE_SHA=$(sha256sum ./Arduino_package/release/TEMP.tar.gz | awk '{print $1}')" >> $GITHUB_ENV
          echo "PACKAGE_SIZE=$(ls -l ./Arduino_package/release/TEMP.tar.gz | awk '{print $5}')" >> $GITHUB_ENV
        shell: bash

      - name: Execute python script
        run: |
          echo "Performing Early release workflow..."
          python private_scripts/ameba_arduino_release_package_maker_b.py ${{ env.REPO_NAME }} E ${{ env.LAST_TAG }} ${{ env.PACKAGE_SHA }} ${{ env.PACKAGE_SIZE }} ${{ env.JSON_LINK_DEV }} ${{ env.RELEASE_BRANCH_NAME }}
          python private_scripts/ameba_arduino_release_notes_maker_b.py E ${{ env.RELEASE_LOG }} ${{ env.RELEASE_COMMIT_LOG }} ${{ env.LAST_TAG }}
        shell: bash

      - name: Set commit message
        id: commit_message_step
        run: |
          echo 'commit_message<<EOF' >> $GITHUB_OUTPUT
          cat ./temp_release_commit_log.txt >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Commit JSON to the branch
        uses: stefanzweifel/git-auto-commit-action@v5
        id: commit
        with:
          commit_message: ${{ steps.commit_message_step.outputs.commit_message }}
          # Only commit JSON files. The large .tar.gz files will NOT go into Git.
          file_pattern: 'Arduino_package/*.json'

      - name: Create GitHub Release and Upload Package
        uses: softprops/action-gh-release@v2
        with:
          # Uses the tag generated by your Python script (e.g., 4.0.5-build20231108)
          tag_name: ${{ env.FINAL_SDK_TAG }}
          name: "Early Release: ${{ env.FINAL_SDK_TAG }}"
          body_path: ${{ env.RELEASE_LOG }}
          # Uploads the tarball directly to the GitHub Release page
          files: ./Arduino_package/release/*.tar.gz
          # Marks it as a pre-release so it doesn't overwrite your stable production releases
          prerelease: true 

      - name: Cleanup temporary files and scripts
        if: always()
        run: |
          rm -f temp_release_commit_log.txt
          rm -rf private_scripts
        shell: bash
